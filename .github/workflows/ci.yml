name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # minifb links against xkbcommon and wayland; the runner image has
      # neither. Nothing here opens a window, but the crate still has to build.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-cursor0 libwayland-dev

      - name: Use the current stable toolchain
        run: rustup update stable && rustup default stable

      - name: Build
        run: cargo build --verbose

      # The suite is all unit tests -- no ROM and no window, so it runs
      # headless without any display.
      - name: Test
        run: cargo test --verbose
